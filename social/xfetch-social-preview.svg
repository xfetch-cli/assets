<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <radialGradient id="glow" cx="76%" cy="44%" r="58%">
      <stop offset="0%" stop-color="#FFC107" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#FFC107" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFC107" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58A55C"/>
      <stop offset="0.25" stop-color="#FFD500"/>
      <stop offset="0.5" stop-color="#81D4FA"/>
      <stop offset="0.75" stop-color="#F48FB1"/>
      <stop offset="1" stop-color="#EF5350"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <clipPath id="termClip">
      <rect x="620" y="136" width="590" height="376" rx="12"/>
    </clipPath>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="#0A0C10"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect x="0" y="0" width="1280" height="5" fill="url(#accent)"/>

  <!-- Official wordmark, dark-background variant -->
  <svg x="84" y="88" width="430" height="75.25" viewBox="0 80 1000 175" overflow="visible">
    <text x="80" y="230" font-family="sans-serif" font-size="160" font-weight="bold" fill="#F0F6FC" stroke="#FFC107" stroke-width="4">X</text>
    <rect x="220" y="115" width="55" height="18" fill="#F0F6FC" stroke="#0A0C10" stroke-width="1"/>
    <text x="283" y="132" font-family="sans-serif" font-size="32" font-weight="bold" fill="#F0F6FC">fetch</text>
    <rect x="375" y="115" width="200" height="18" fill="#58A55C"/>
    <rect x="590" y="115" width="175" height="18" fill="#FFD500"/>
    <rect x="235" y="140" width="165" height="18" fill="#81D4FA"/>
    <rect x="415" y="140" width="35" height="18" fill="#F48FB1" stroke="#D81B60" stroke-width="0.5"/>
    <rect x="465" y="140" width="130" height="18" fill="#30363D"/>
    <rect x="610" y="140" width="185" height="18" fill="#B9F6CA"/>
    <rect x="255" y="165" width="85" height="18" fill="#C8E6C9"/>
    <rect x="350" y="165" width="85" height="18" fill="#30363D"/>
    <rect x="445" y="165" width="100" height="18" fill="#EF5350"/>
    <rect x="555" y="165" width="200" height="18" fill="#4CAF50"/>
    <rect x="770" y="165" width="50" height="18" fill="#FFCA28"/>
    <rect x="228" y="190" width="237" height="18" fill="#FFA726" stroke="#0A0C10" stroke-width="1"/>
    <rect x="475" y="190" width="20" height="18" fill="#66BB6A"/>
    <rect x="505" y="190" width="60" height="18" fill="#66BB6A"/>
    <rect x="575" y="190" width="145" height="18" fill="#E1BEE7" stroke="#D81B60" stroke-width="1"/>
    <rect x="730" y="190" width="35" height="18" fill="#F0F6FC" stroke="#0A0C10" stroke-width="1"/>
    <rect x="230" y="215" width="210" height="18" fill="#FFE0B2" stroke="#0A0C10" stroke-width="1"/>
    <rect x="452" y="215" width="175" height="18" fill="#FDD835"/>
    <rect x="638" y="215" width="55" height="18" fill="#C8E6C9"/>
    <rect x="705" y="215" width="135" height="18" fill="#80DEEA"/>
  </svg>

  <!-- Headline -->
  <text x="84" y="262" font-family="JetBrains Mono" font-weight="800" font-size="56" fill="#F0F6FC">Your system,</text>
  <text x="84" y="326" font-family="JetBrains Mono" font-weight="800" font-size="56" fill="#FFC107">at a glance.</text>

  <!-- Subhead -->
  <text x="84" y="392" font-family="Noto Sans" font-size="21" fill="#A8B3C1">Fast, cross-platform system information for</text>
  <text x="84" y="422" font-family="Noto Sans" font-size="21" fill="#A8B3C1">your terminal. Written in Rust.</text>

  <!-- Platforms -->
  <text x="84" y="486" font-family="JetBrains Mono" font-size="14" letter-spacing="1.5" fill="#8B949E">LINUX   ·   MACOS   ·   WINDOWS</text>

  <!-- URL -->
  <text x="84" y="560" font-family="JetBrains Mono" font-size="15" fill="#6E7681">GITHUB</text>
  <text x="154" y="560" font-family="JetBrains Mono" font-size="15" fill="#E6EDF3">github.com/xfetch-cli/xfetch</text>

  <!-- Terminal window -->
  <rect x="632" y="148" width="590" height="376" rx="12" fill="#000000" opacity="0.55" filter="url(#softShadow)"/>
  <rect x="620" y="136" width="590" height="376" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <circle cx="642" cy="157" r="5" fill="#FF5F56"/>
  <circle cx="660" cy="157" r="5" fill="#FFBD2E"/>
  <circle cx="678" cy="157" r="5" fill="#27C93F"/>
  <text x="915" y="162" text-anchor="middle" font-family="JetBrains Mono" font-size="12" fill="#8B949E">xfetch</text>
  <image x="621" y="178" width="588" height="334" href="term.png" preserveAspectRatio="xMidYMid slice" clip-path="url(#termClip)"/>
  <rect x="621" y="178" width="588" height="334" fill="none" stroke="#30363D" stroke-width="1" clip-path="url(#termClip)"/>

  <text x="915" y="545" text-anchor="middle" font-family="JetBrains Mono" font-size="12" fill="#6E7681">xfetch on Arch Linux</text>
</svg>
